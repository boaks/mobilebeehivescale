<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 55">

<text x="20" y="8" font-size="6px" >2 Stück unterer starker Winkel, 40x40x4mm, 390mm, 4x 6mm Bohrungen</text>

<rect stroke="black" fill="gainsboro" stroke-width="1" x="5" y="15" width="390" height="40" stroke-linejoin="round" />
<rect stroke="black" fill="silver" stroke-width="1" x="5" y="15" width="390" height="4" stroke-linejoin="round" />

<text x="128" y="40" font-size="4px">6mm &#xD8;</text>

<!-- Doppel-Kreuz Waegezelle -->
<line stroke="grey" fill="none" stroke-width="1" x1="70" y1="32" x2="165" y2="32" stroke-dasharray="3 3" />
<line stroke="grey" fill="none" stroke-width="1" x1="122" y1="47" x2="165" y2="47" stroke-dasharray="3 3" />
<line stroke="grey" fill="none" stroke-width="1" x1="147" y1="20" x2="147" y2="54" stroke-dasharray="3 3" />

<!-- Bohrungen Waegezelle -->
<circle stroke="black" fill="white" stroke-width="1" cx="147" cy="32" r="3"/>
<circle stroke="black" fill="white" stroke-width="1" cx="147" cy="47" r="3"/>

<!-- Maßpfeile Waegezelle -->
<path stroke="grey" fill="none" stroke-width="1" d="M6,23 l1,1 m0,-2 l-1,1 l140,0 l-1,1 m0,-2 l1,1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="28" font-size="4px" text-anchor="middle">142mm</text>

<path stroke="grey" fill="none" stroke-width="1" d="M155,16 l1,1 m-2,0 l1,-1 l0,15 l1,-1 m-2,0 l1,1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="160" y="26" font-size="4px" >17mm</text>

<path stroke="grey" fill="none" stroke-width="1" d="M155,33 l1,1 m-2,0 l1,-1 l0,13 l1,-1 m-2,0 l1,1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="160" y="42" font-size="4px" >15mm</text>

<path stroke="grey" fill="none" stroke-width="1" d="M155,48 l1,1 m-2,0 l1,-1 l0,6 l1,-1 m-2,0 l1,1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="160" y="52" font-size="4px" >8mm</text>


<!-- Kreuz links -->
<line stroke="grey" fill="none" stroke-width="1" x1="28" y1="27" x2="28" y2="54" stroke-dasharray="3 3" />
<line stroke="grey" fill="none" stroke-width="1" x1="7" y1="35" x2="51" y2="35" stroke-dasharray="3 3" />

<!-- Kreuz rechts -->
<line stroke="grey" fill="none" stroke-width="1" x1="372" y1="23" x2="372" y2="54" stroke-dasharray="3 3" />
<line stroke="grey" fill="none" stroke-width="1" x1="343" y1="35" x2="393" y2="35" stroke-dasharray="3 3" />

<!-- Bohrungen links -->
<circle stroke="black" fill="white" stroke-width="1" cx="28" cy="35" r="3"/>
<!-- Bohrungen rechts -->
<circle stroke="black" fill="white" stroke-width="1" cx="372" cy="35" r="3"/>

<!-- Maßpfeile links -->
<path stroke="grey" fill="none" stroke-width="1" d="M6,42 l1,1 m0,-2 l-1,1 l21,0 l-1,1 m0,-2 l1,1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="17" y="48" font-size="4px" text-anchor="middle">23mm</text>

<path stroke="grey" fill="none" stroke-width="1" d="M39,36 l1,1 m-2,0 l1,-1 l0,18 l1,-1 m-2,0 l1,1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="41" y="44" font-size="4px">20mm</text>

<!-- Maßpfeile rechts -->
<path stroke="grey" fill="none" stroke-width="1" d="M373,27 l1,1 m0,-2 l-1,1 l21,0 l-1,1 m0,-2 l1,1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="388" y="33" font-size="4px" text-anchor="middle">23mm</text>

<path stroke="grey" fill="none" stroke-width="1" d="M379,36 l1,1 m-2,0 l1,-1 l0,18 l1,-1 m-2,0 l1,1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="382" y="44" font-size="4px">20mm</text>

</svg>
